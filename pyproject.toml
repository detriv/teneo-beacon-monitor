[project]
name = "teneo-beacon-monitor"
version = "1.0.0"
description = "FastAPI monitor for Teneo Protocol Beacon boost cooldown with Telegram notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings>=2.4.0",
    "apscheduler>=3.10.0",
    "requests>=2.31.0",
    "python-telegram-bot>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.fastapi]
entrypoint = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
